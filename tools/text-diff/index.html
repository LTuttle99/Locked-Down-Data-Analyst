<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff — Data and Analytics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300133C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%230062F1' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <header class="border-b border-slate-200 bg-white px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="../../index.html" class="text-xs text-slate-500 hover:text-[#0062F1]">&larr; Hub</a>
            <div class="h-6 w-px bg-slate-100"></div>
            <h1 class="text-lg font-semibold text-[#00133C]">Text Diff</h1>
        </div>
        <div class="text-xs text-slate-600 bg-slate-50 px-3 py-1 rounded-full border border-slate-200">Line-level comparison</div>
    </header>

    <main class="max-w-6xl mx-auto p-6 space-y-4">
        <p class="text-sm text-slate-600 max-w-2xl">
            Paste two blocks of text — configs, emails, document revisions — and see exactly which
            lines were added, removed, or kept.
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl p-4">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Original</label>
                <textarea id="text-a" spellcheck="false" rows="12"
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm font-mono text-slate-900 focus:border-[#0062F1] focus:ring-2 focus:ring-[#0062F1]/20 focus:outline-none resize-y"
                    placeholder="Paste the original text..."></textarea>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Revised</label>
                <textarea id="text-b" spellcheck="false" rows="12"
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm font-mono text-slate-900 focus:border-[#0062F1] focus:ring-2 focus:ring-[#0062F1]/20 focus:outline-none resize-y"
                    placeholder="Paste the revised text..."></textarea>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-4">
            <button onclick="runDiff()" class="bg-[#0062F1] hover:bg-[#0050C7] text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">
                Compare
            </button>
            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" id="word-level" checked class="accent-[#0062F1]"> Highlight changed words within a line
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" id="ignore-space" class="accent-[#0062F1]"> Ignore leading and trailing spaces
            </label>
        </div>

        <div id="results" class="hidden space-y-4">
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white border border-slate-200 p-4 rounded-xl">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-600">Added</p>
                    <p id="count-added" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-600">Removed</p>
                    <p id="count-removed" class="text-2xl font-bold text-red-600 mt-1">0</p>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-600">Unchanged</p>
                    <p id="count-same" class="text-2xl font-bold text-slate-500 mt-1">0</p>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-4">
                <div id="diff-output" class="text-xs font-mono overflow-x-auto"></div>
            </div>
        </div>
    </main>

    <script>
        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'text-sm rounded-lg px-4 py-3 shadow-2xl max-w-md bg-red-50 border border-red-300 text-red-500';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function diffLines(linesA, linesB) {
            const n = linesA.length;
            const m = linesB.length;

            const dp = new Array(n + 1);
            for (let i = 0; i <= n; i++) dp[i] = new Uint32Array(m + 1);

            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    dp[i][j] = linesA[i] === linesB[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }

            const result = [];
            let i = 0;
            let j = 0;
            while (i < n && j < m) {
                if (linesA[i] === linesB[j]) {
                    result.push({ type: 'same', text: linesA[i] });
                    i++; j++;
                } else if (dp[i + 1][j] >= dp[i][j + 1]) {
                    result.push({ type: 'removed', text: linesA[i] });
                    i++;
                } else {
                    result.push({ type: 'added', text: linesB[j] });
                    j++;
                }
            }
            while (i < n) { result.push({ type: 'removed', text: linesA[i] }); i++; }
            while (j < m) { result.push({ type: 'added', text: linesB[j] }); j++; }
            return result;
        }

        function splitWords(line) {
            return line.split(/(\s+)/).filter(t => t !== '');
        }

        function diffWords(oldLine, newLine) {
            const a = splitWords(oldLine);
            const b = splitWords(newLine);
            const n = a.length;
            const m = b.length;

            const dp = [];
            for (let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));

            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }

            const oldParts = [];
            const newParts = [];
            let i = 0;
            let j = 0;

            while (i < n && j < m) {
                if (a[i] === b[j]) {
                    oldParts.push({ same: true, text: a[i] });
                    newParts.push({ same: true, text: b[j] });
                    i++; j++;
                } else if (dp[i + 1][j] >= dp[i][j + 1]) {
                    oldParts.push({ same: false, text: a[i] });
                    i++;
                } else {
                    newParts.push({ same: false, text: b[j] });
                    j++;
                }
            }
            while (i < n) { oldParts.push({ same: false, text: a[i] }); i++; }
            while (j < m) { newParts.push({ same: false, text: b[j] }); j++; }

            const toHtml = (parts, cls) => parts.map(p =>
                p.same ? escapeHtml(p.text) : `<mark class="${cls} rounded px-0.5">${escapeHtml(p.text)}</mark>`
            ).join('');

            return {
                oldHtml: toHtml(oldParts, 'bg-red-200 text-red-900'),
                newHtml: toHtml(newParts, 'bg-emerald-200 text-emerald-900')
            };
        }

        function applyWordLevel(diff) {
            let i = 0;
            while (i < diff.length) {
                if (diff[i].type !== 'removed') { i++; continue; }

                let removedEnd = i;
                while (removedEnd < diff.length && diff[removedEnd].type === 'removed') removedEnd++;

                let addedEnd = removedEnd;
                while (addedEnd < diff.length && diff[addedEnd].type === 'added') addedEnd++;

                const removed = diff.slice(i, removedEnd);
                const added = diff.slice(removedEnd, addedEnd);
                const pairs = Math.min(removed.length, added.length);

                for (let k = 0; k < pairs; k++) {
                    const oldLine = removed[k].text;
                    const newLine = added[k].text;
                    if (oldLine.length > 2000 || newLine.length > 2000) continue;

                    const { oldHtml, newHtml } = diffWords(oldLine, newLine);
                    removed[k].html = oldHtml;
                    added[k].html = newHtml;
                }

                i = addedEnd > i ? addedEnd : i + 1;
            }
        }

        function runDiff() {
            const a = document.getElementById('text-a').value;
            const b = document.getElementById('text-b').value;
            const trimEnds = document.getElementById('ignore-space').checked;

            const prep = (text) => {
                const lines = text.split('\n');
                return trimEnds ? lines.map(l => l.trim()) : lines;
            };

            const linesA = prep(a);
            const linesB = prep(b);

            if (linesA.length * linesB.length > 4000000) {
                showToast('These texts are too large to diff line-by-line in the browser (limit ~2,000 lines each side).');
                return;
            }

            const diff = diffLines(linesA, linesB);

            const added = diff.filter(d => d.type === 'added').length;
            const removed = diff.filter(d => d.type === 'removed').length;
            const same = diff.filter(d => d.type === 'same').length;

            document.getElementById('count-added').innerText = added.toLocaleString();
            document.getElementById('count-removed').innerText = removed.toLocaleString();
            document.getElementById('count-same').innerText = same.toLocaleString();

            if (document.getElementById('word-level').checked) applyWordLevel(diff);

            document.getElementById('diff-output').innerHTML = diff.map(d => {
                const bg = d.type === 'added' ? 'bg-emerald-50' : d.type === 'removed' ? 'bg-red-50' : '';
                const color = d.type === 'added' ? 'text-emerald-700' : d.type === 'removed' ? 'text-red-700' : 'text-slate-600';
                const prefix = d.type === 'added' ? '+' : d.type === 'removed' ? '-' : ' ';
                const body = d.html !== undefined ? d.html : escapeHtml(d.text);
                return `<div class="${bg} ${color} px-2 py-0.5 whitespace-pre-wrap break-words">${prefix} ${body}</div>`;
            }).join('');

            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
