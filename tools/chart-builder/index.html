<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Builder — Data and Analytics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300133C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%230062F1' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <header class="border-b border-slate-200 bg-white px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="../../index.html" class="text-xs text-slate-500 hover:text-[#0062F1]">&larr; Hub</a>
            <div class="h-6 w-px bg-slate-100"></div>
            <h1 class="text-lg font-semibold text-[#00133C]">Chart Builder</h1>
        </div>
        <div class="text-xs text-slate-600 bg-slate-50 px-3 py-1 rounded-full border border-slate-200">File to chart, then PNG</div>
    </header>

    <main class="max-w-6xl mx-auto p-6 space-y-4">
        <p class="text-sm text-slate-600 max-w-3xl">
            Pick two columns and get a clean chart you can drop into a deck. No pivot setup, no mapping
            step. Download it as a PNG when it looks right.
        </p>

        <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-4">
            <label class="block bg-slate-50 border border-dashed border-slate-300 hover:border-[#0062F1] rounded-lg p-5 text-center cursor-pointer transition-colors">
                <span class="text-sm text-slate-600">Choose a CSV, Excel, or JSON file</span>
                <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.xlsm,.json" class="hidden">
            </label>
            <p id="file-status" class="text-xs text-slate-500">No file loaded.</p>

            <div id="controls" class="hidden space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                        <label for="chart-type" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Chart type</label>
                        <select id="chart-type" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900">
                            <option value="bar">Bar</option>
                            <option value="horizontalBar">Bar (horizontal)</option>
                            <option value="line">Line</option>
                            <option value="area">Area</option>
                            <option value="pie">Pie</option>
                            <option value="doughnut">Doughnut</option>
                            <option value="scatter">Scatter</option>
                        </select>
                    </div>
                    <div>
                        <label for="x-column" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Labels (x axis)</label>
                        <select id="x-column" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900"></select>
                    </div>
                    <div>
                        <label for="y-column" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Values (y axis)</label>
                        <select id="y-column" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900"></select>
                    </div>
                    <div>
                        <label for="agg" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Combine duplicates by</label>
                        <select id="agg" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900">
                            <option value="sum">Sum</option>
                            <option value="avg">Average</option>
                            <option value="count">Count of rows</option>
                            <option value="min">Minimum</option>
                            <option value="max">Maximum</option>
                            <option value="none">Do not combine</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap items-end gap-4">
                    <div>
                        <label for="chart-title" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Title</label>
                        <input type="text" id="chart-title" placeholder="Optional chart title" class="bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900 w-64">
                    </div>
                    <div>
                        <label for="top-n" class="block text-[10px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Show top</label>
                        <select id="top-n" class="bg-slate-50 border border-slate-300 rounded-lg text-sm p-2 text-slate-900">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="0">All</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-slate-700">
                        <input type="checkbox" id="sort-desc" checked class="accent-[#0062F1]"> Sort by value
                    </label>
                    <button onclick="downloadPng()" class="bg-white border border-slate-300 hover:border-[#0062F1] text-[#00133C] text-sm font-medium px-4 py-2 rounded-lg transition-colors">Download PNG</button>
                </div>
            </div>
        </div>

        <div id="chart-card" class="hidden bg-white border border-slate-200 rounded-xl p-6">
            <div class="relative h-[26rem]">
                <canvas id="chart-canvas"></canvas>
            </div>
            <p id="chart-note" class="text-[10px] text-slate-500 mt-3"></p>
        </div>
    </main>

    <script src="../shared/parse.js"></script>
    <script>
        const PALETTE = ['#0062F1', '#00133C', '#DC6803', '#059669', '#7C3AED', '#DB2777', '#0891B2', '#CA8A04'];

        let fileData = null;
        let chart = null;

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'text-sm rounded-lg px-4 py-3 shadow-2xl max-w-md bg-red-50 border border-red-300 text-red-500';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function toNum(v) {
            if (v === null || v === undefined || String(v).trim() === '') return null;
            const n = Number(v);
            return Number.isFinite(n) ? n : null;
        }

        function isNumericColumn(col) {
            let seen = 0;
            for (const r of fileData.rows.slice(0, 300)) {
                const v = r[col];
                if (v === null || v === undefined || String(v).trim() === '') continue;
                if (toNum(v) === null) return false;
                seen++;
            }
            return seen > 0;
        }

        function aggregate(values, mode) {
            if (mode === 'count') return values.length;
            const nums = values.map(toNum).filter(v => v !== null);
            if (nums.length === 0) return 0;
            if (mode === 'sum') return nums.reduce((a, b) => a + b, 0);
            if (mode === 'avg') return nums.reduce((a, b) => a + b, 0) / nums.length;
            if (mode === 'min') return Math.min(...nums);
            if (mode === 'max') return Math.max(...nums);
            return nums[0];
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                fileData = await parseFileToRows(file);
                if (fileData.columns.length === 0) throw new Error('No readable columns found.');

                document.getElementById('file-status').innerText = `${file.name} — ${fileData.rows.length.toLocaleString()} rows, ${fileData.columns.length} columns`;

                const numeric = fileData.columns.filter(isNumericColumn);
                const text = fileData.columns.filter(c => !numeric.includes(c));

                const xSelect = document.getElementById('x-column');
                const ySelect = document.getElementById('y-column');
                xSelect.innerHTML = fileData.columns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
                ySelect.innerHTML = fileData.columns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

                if (text.length > 0) xSelect.value = text[0];
                if (numeric.length > 0) ySelect.value = numeric[0];

                document.getElementById('controls').classList.remove('hidden');
                render();
            } catch (err) {
                showToast('Could not read that file: ' + err.message);
            } finally {
                e.target.value = '';
            }
        });

        function buildSeries() {
            const xCol = document.getElementById('x-column').value;
            const yCol = document.getElementById('y-column').value;
            const mode = document.getElementById('agg').value;
            const topN = Number(document.getElementById('top-n').value);
            const sortDesc = document.getElementById('sort-desc').checked;

            let points;

            if (mode === 'none') {
                points = fileData.rows.map(r => ({
                    label: r[xCol] === null || r[xCol] === undefined ? '(blank)' : String(r[xCol]),
                    value: toNum(r[yCol]) ?? 0
                }));
            } else {
                const groups = new Map();
                for (const r of fileData.rows) {
                    const key = r[xCol] === null || r[xCol] === undefined || String(r[xCol]).trim() === '' ? '(blank)' : String(r[xCol]);
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(r[yCol]);
                }
                points = Array.from(groups.entries()).map(([label, vals]) => ({ label, value: aggregate(vals, mode) }));
            }

            if (sortDesc) points.sort((a, b) => b.value - a.value);
            const truncated = topN > 0 && points.length > topN;
            if (truncated) points = points.slice(0, topN);

            return { points, truncated, xCol, yCol, mode };
        }

        function render() {
            if (!fileData) return;

            const type = document.getElementById('chart-type').value;
            const { points, truncated, xCol, yCol, mode } = buildSeries();

            if (points.length === 0) {
                showToast('Nothing to chart with those columns.');
                return;
            }

            const labels = points.map(p => p.label);
            const values = points.map(p => p.value);
            const isPie = type === 'pie' || type === 'doughnut';
            const isScatter = type === 'scatter';

            const chartType = type === 'horizontalBar' || type === 'area' ? (type === 'area' ? 'line' : 'bar') : type;

            const colors = isPie
                ? labels.map((_, i) => PALETTE[i % PALETTE.length])
                : PALETTE[0];

            const dataset = isScatter
                ? {
                    label: `${yCol} by ${xCol}`,
                    data: points.map((p, i) => ({ x: toNum(p.label) ?? i, y: p.value })),
                    backgroundColor: PALETTE[0]
                }
                : {
                    label: mode === 'count' ? 'Count of rows' : `${mode === 'avg' ? 'Average' : mode === 'sum' ? 'Total' : mode} of ${yCol}`,
                    data: values,
                    backgroundColor: colors,
                    borderColor: isPie ? '#ffffff' : PALETTE[0],
                    borderWidth: isPie ? 2 : 2,
                    fill: type === 'area',
                    tension: 0.3
                };

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById('chart-canvas'), {
                type: chartType,
                data: { labels: isScatter ? undefined : labels, datasets: [dataset] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: type === 'horizontalBar' ? 'y' : 'x',
                    plugins: {
                        legend: { display: isPie, position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
                        title: {
                            display: !!document.getElementById('chart-title').value.trim(),
                            text: document.getElementById('chart-title').value.trim(),
                            color: '#00133C',
                            font: { size: 15, weight: 'bold' },
                            padding: { bottom: 14 }
                        }
                    },
                    scales: isPie ? {} : {
                        x: { ticks: { color: '#475569', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#475569', font: { size: 10 } }, grid: { color: '#e2e8f0' }, beginAtZero: true }
                    }
                }
            });

            document.getElementById('chart-card').classList.remove('hidden');
            document.getElementById('chart-note').innerText = truncated
                ? `Showing the top ${points.length} of the full set. Change "Show top" to see more.`
                : `${points.length} ${points.length === 1 ? 'category' : 'categories'} shown.`;
        }

        function downloadPng() {
            if (!chart) return;

            const source = document.getElementById('chart-canvas');
            const out = document.createElement('canvas');
            out.width = source.width;
            out.height = source.height;

            const ctx = out.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, out.width, out.height);
            ctx.drawImage(source, 0, 0);

            const a = document.createElement('a');
            a.href = out.toDataURL('image/png');
            a.download = 'chart.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        ['chart-type', 'x-column', 'y-column', 'agg', 'top-n'].forEach(id => {
            document.getElementById(id).addEventListener('change', render);
        });
        document.getElementById('sort-desc').addEventListener('change', render);
        document.getElementById('chart-title').addEventListener('input', render);
    </script>
</body>
</html>
